name: Scheduled Macro Data Refresh

on:
  schedule:
    # Runs 3 times daily (00:00, 08:00, and 16:00 UTC)
    - cron: '0 0,8,16 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Latest Macroeconomic Data
        run: |
          python fetch_data.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add macro_data.json data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-refresh macro data [skip ci]" && git push)
