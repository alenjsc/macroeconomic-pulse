# Netlify Configuration for Macro Pulse Dashboard
[build]
  publish = "."

# Ensure dynamic data files are revalidated so visitors always see fresh macro data
[[headers]]
  for = "/data.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/macro_data.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Ensure styles and app logic revalidate immediately on deployment
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
